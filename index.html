const dogTeam = (() => {
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const root = new THREE.Group();
  const dogs = DOG_SPOTS.map(([x, z], i) => {
    const dog = makeDog(DOG_FUR[i]);
    dog.root.position.set(x, 0, z);
    root.add(dog.root);
    return dog;
  });
  // Tow ropes: from both hands to a towbar, out to where the pair are hitched, and on to the lead dog.
  const ropeMat = gearMat('#3a2a1c');
  const towbar = V(0, 0.75, -1.2), split = V(0, 0.5, -2.55);
  const ropes = new THREE.Group();
  for (const side of [-1, 1]) ropes.add(limb(V(side * 0.31, 1.0, -0.48), towbar, 0.012, ropeMat));
  ropes.add(limb(towbar, split, 0.014, ropeMat));
  for (const [x, z] of DOG_SPOTS) ropes.add(limb(split, V(x * 0.8, 0.52, z + 0.4), 0.012, ropeMat));
  root.add(ropes);
  course.add(root);
  return { root, dogs, ropes, phase: 0, loose: false, runSpeed: 0 };
})();

function updateDogs(dt) {
  const team = dogTeam;
  team.root.visible = skin === 'dogSled';
  if (!team.root.visible) return;
  const crashed = state === 'crashed' || state === 'over';
  if (crashed && !team.loose) {
    // You wipe out, they break loose and carry on down the mountain.
    team.loose = true;
    team.runSpeed = levelKmh(player.points) / 3.6;
  } else if (!crashed) team.loose = false;
  team.ropes.visible = !team.loose;

  let speed = 0;
  const r = team.root;
  if (team.loose) {
    team.runSpeed *= Math.exp(-dt * 0.6);
    speed = team.runSpeed;
    r.position.x = THREE.MathUtils.clamp(r.position.x - Math.sin(r.rotation.y) * speed * dt, -WALL_LIMIT, WALL_LIMIT);
    r.position.z -= Math.cos(r.rotation.y) * speed * dt;
    r.position.y += (0 - r.position.y) * Math.min(1, dt * 4);
  } else {
    r.position.set(player.x, player.y, player.z);
    r.rotation.y = player.yaw;
    if (state === 'playing') speed = player.speed;
  }

  // Galloping: front legs together, back legs together, a little out of step with each other.
  const stride = Math.min(1, speed / 5);
  team.phase += dt * (4 + speed * 0.35) * (speed > 0.3 ? 1 : 0);
  team.dogs.forEach((dog, i) => {
    const p = team.phase + i * 0.9;
    const swing = [p, p + 0.4, p + Math.PI, p + Math.PI + 0.4];
    dog.legs.forEach((leg, k) => { leg.rotation.x = Math.sin(swing[k]) * 0.8 * stride; });
    dog.body.position.y = Math.abs(Math.sin(p)) * 0.07 * stride;
    dog.body.rotation.x = Math.sin(p) * 0.06 * stride;
  });
}

// ---------------------------------------------------------------------------
// Snow spray from the ski edges (thrown forward so you can see it)
// ---------------------------------------------------------------------------
const dotTex = makeDotTexture();
const SPRAY_N = 600;
const spray = {
  pos: new Float32Array(SPRAY_N * 3).fill(-1000),
  vel: new Float32Array(SPRAY_N * 3),
  life: new Float32Array(SPRAY_N),
  next: 0,
  carry: 0,
};
const sprayGeo = new THREE.BufferGeometry();
sprayGeo.setAttribute('position', new THREE.BufferAttribute(spray.pos, 3));
const sprayPoints = new THREE.Points(sprayGeo, new THREE.PointsMaterial({
  map: dotTex, size: 0.22, transparent: true, opacity: 0.9, depthWrite: false, color: '#ffffff',
}));
sprayPoints.frustumCulled = false;
course.add(sprayPoints);

// Thrown from the ski tips along the way you're facing; side is -1/+1 for
// left/right of your skis.
function emitSpray(x, z, side, speed, count) {
  const fx = Math.sin(player.heading), fz = -Math.cos(player.heading); // forward
  const rx = -fz, rz = fx;                                             // right
  for (let n = 0; n < count; n++) {
    const i = spray.next;
    spray.next = (spray.next + 1) % SPRAY_N;
    const ahead = 1.2 + Math.random() * 0.6;
    const across = (Math.random() - 0.5) * 0.5;
    spray.pos[i * 3] = x + fx * ahead + rx * across;
    spray.pos[i * 3 + 1] = player.ground + 0.1;
    spray.pos[i * 3 + 2] = z + fz * ahead + rz * across;
    const out = side * (1.5 + Math.random() * 4) + (Math.random() - 0.5);
    const fwd = speed * (0.8 + Math.random() * 0.25);
    spray.vel[i * 3] = fx * fwd + rx * out;
    spray.vel[i * 3 + 1] = 1.2 + Math.random() * 3;
    spray.vel[i * 3 + 2] = fz * fwd + rz * out;
    spray.life[i] = 0.4 + Math.random() * 0.5;
  }
}

function updateSpray(dt) {
  for (let i = 0; i < SPRAY_N; i++) {
    if (spray.life[i] <= 0) continue;
    spray.life[i] -= dt;
    if (spray.life[i] <= 0) { spray.pos[i * 3 + 1] = -1000; continue; }
    spray.vel[i * 3 + 1] -= 12 * dt;
    spray.pos[i * 3] += spray.vel[i * 3] * dt;
    spray.pos[i * 3 + 1] = Math.max(0.03, spray.pos[i * 3 + 1] + spray.vel[i * 3 + 1] * dt);
    spray.pos[i * 3 + 2] += spray.vel[i * 3 + 2] * dt;
  }
  sprayGeo.attributes.position.needsUpdate = true;
}

// ---------------------------------------------------------------------------
// Falling snow around the camera
// ---------------------------------------------------------------------------
const FLAKES = 900;
const FLAKE_BOX = new THREE.Vector3(70, 34, 90);
const flakePos = new Float32Array(FLAKES * 3);
for (let i = 0; i < FLAKES; i++) {
  flakePos[i * 3] = (Math.random() - 0.5) * FLAKE_BOX.x;
  flakePos[i * 3 + 1] = (Math.random() - 0.5) * FLAKE_BOX.y;
  flakePos[i * 3 + 2] = (Math.random() - 0.5) * FLAKE_BOX.z;
}
const flakeGeo = new THREE.BufferGeometry();
flakeGeo.setAttribute('position', new THREE.BufferAttribute(flakePos, 3));
const flakes = new THREE.Points(flakeGeo, new THREE.PointsMaterial({
  map: dotTex, size: 0.16, transparent: true, opacity: 0.85, depthWrite: false,
}));
flakes.frustumCulled = false;
scene.add(flakes);

function updateFlakes(dt, t) {
  const d = new THREE.Vector3().subVectors(camera.position, lastCamPos);
  lastCamPos.copy(camera.position);
  if (d.lengthSq() > 400) d.set(0, 0, 0); // teleported (restart)
  const wrap = (v, size) => ((v + size / 2) % size + size) % size - size / 2;
  for (let i = 0; i < FLAKES; i++) {
    const k = i * 3;
    flakePos[k] = wrap(flakePos[k] - d.x + Math.sin(t * 0.7 + i) * 0.4 * dt, FLAKE_BOX.x);
    flakePos[k + 1] = wrap(flakePos[k + 1] - d.y - (1.2 + (i % 7) * 0.15) * dt, FLAKE_BOX.y);
    flakePos[k + 2] = wrap(flakePos[k + 2] - d.z, FLAKE_BOX.z);
  }
  flakeGeo.attributes.position.needsUpdate = true;
  flakes.position.copy(camera.position);
  flakes.position.z -= FLAKE_BOX.z * 0.3;
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
const keys = new Set();
const touch = { left: false, right: false, startY: 0 };
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (e.code === 'Space' || e.code === 'Enter') {
    if (state === 'ready' || state === 'paused') { startOrResume(); return; }
    if (state === 'over') { restart(); return; }
  }
  if ((e.code === 'Space' || e.code === 'KeyW') && !e.repeat) jump();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyR' && state !== 'ready') restart();
  if (e.code === 'KeyV') setView(view === 'first' ? 'third' : 'first');
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); if (state === 'playing') togglePause(); });

function readTouches(e) {
  touch.left = touch.right = false;
  for (const t of e.touches) {
    if (t.clientX < innerWidth / 2) touch.left = true; else touch.right = true;
  }
}
const onViewButtons = e => e.target.closest?.('#views, #skins');
addEventListener('touchstart', e => {
  if (onViewButtons(e)) return;
  overlayTap();
  touch.startY = e.touches[0].clientY;
  readTouches(e);
}, { passive: true });
addEventListener('touchmove', e => {
  // Swipe up to jump.
  if (touch.startY - e.touches[0].clientY > 50) { jump(); touch.startY = -Infinity; }
  readTouches(e);
}, { passive: true });
addEventListener('touchend', readTouches, { passive: true });
function overlayTap() {
  if (state === 'over') restart();
  else if (state === 'ready' || state === 'paused') startOrResume();
}
document.getElementById('overlay').addEventListener('mousedown', e => {
  if (!onViewButtons(e)) overlayTap();
});
for (const b of document.querySelectorAll('#views button')) {
  b.addEventListener('click', () => setView(b.dataset.view));
}

const held = (...codes) => codes.some(c => keys.has(c));

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const FRESH_PLAYER = { x: 0, y: 0, z: 0, vx: 0, vy: 0, speed: 0, steer: 0, yaw: 0, shake: 0, dip: 0, duck: 0, heading: 0, points: 0, ground: 0, rampJump: false, gems: 0 };
const levelKmh = points => START_KMH + KMH_PER_POINT * points;
const player = { ...FRESH_PLAYER };
let state = 'ready';

// Camera perspective, remembered between visits.
let view = 'first';
try { if (localStorage.getItem('powderRun.view') === 'third') view = 'third'; } catch {}

function setView(v) {
  view = v;
  try { localStorage.setItem('powderRun.view', v); } catch {}
  for (const b of document.querySelectorAll('#views button')) {
    b.classList.toggle('active', b.dataset.view === v);
  }
}
setView(view);

let best = 0;
try { best = Number(localStorage.getItem('powderRun.best')) || 0; } catch {}
let gems = 0; // the currency: kept between runs, for skins
try { gems = Number(localStorage.getItem('powderRun.gems')) || 0; } catch {}

const ui = {
  hud: document.getElementById('hud'),
  overlay: document.getElementById('overlay'),
  title: document.getElementById('title'),
  subtitle: document.getElementById('subtitle'),
  go: document.getElementById('go'),
  keys: document.getElementById('keys'),
  dist: document.getElementById('dist'),
  points: document.getElementById('points'),
  pointsChip: document.getElementById('points-chip'),
  levelBar: document.getElementById('level-bar'),
  toast: document.getElementById('toast'),
  zone: document.getElementById('zone'),
  speed: document.getElementById('speed'),
  gems: document.getElementById('gems'),
  gemsChip: document.getElementById('gems-chip'),
  cardGems: document.getElementById('card-gems'),
  skinNote: document.getElementById('skin-note'),
};
ui.gems.textContent = gems;

// Skins: bought with gems, kept between runs.
const SKINS = {
  classic: { name: 'Classic', price: 0 },
  dogSled: { name: 'Dog Sled', price: 50 }, // three huskies out front pulling you along
  snowboard: { name: 'Snowboard', price: 30 },
  snowmobile: { name: 'Snowmobile', price: 100 },
};
let ownedSkins = ['classic'];
try { ownedSkins = JSON.parse(localStorage.getItem('powderRun.skins')) || ownedSkins; } catch {}
let skin = 'classic';
try { const s = localStorage.getItem('powderRun.skin'); if (ownedSkins.includes(s)) skin = s; } catch {}

function renderSkins() {
  ui.cardGems.textContent = gems;
  for (const b of document.querySelectorAll('#skins button')) {
    const id = b.dataset.skin, { name, price } = SKINS[id], owned = ownedSkins.includes(id);
    b.classList.toggle('active', id === skin);
    b.classList.toggle('locked', !owned && gems < price);
    b.innerHTML = owned ? name : `${name} <span class="gem-icon"></span>${price}`;
  }
}
function chooseSkin(id) {
  ui.skinNote.textContent = '';
  if (!ownedSkins.includes(id)) {
    const { name, price } = SKINS[id];
    if (gems < price) {
      ui.skinNote.textContent = `You need ${price - gems} more gems for the ${name}.`;
      return;
    }
    gems -= price;
    ownedSkins.push(id);
    ui.gems.textContent = gems;
    try {
      localStorage.setItem('powderRun.gems', gems);
      localStorage.setItem('powderRun.skins', JSON.stringify(ownedSkins));
    } catch {}
  }
  skin = id;
  try { localStorage.setItem('powderRun.skin', id); } catch {}
  renderSkins();
  applySkin();
}
// Skis, a board or a snowmobile, in both views.
function applySkin() {
  const board = skin === 'snowboard', sled = skin === 'snowmobile', skis = !board && !sled;
  skier.skis.forEach(s => { s.visible = skis; });
  skier.poles.forEach(p => { p.visible = skis; });
  skier.board.visible = board;
  skier.sled.visible = sled;
  viewModel.pair.forEach(s => { s.visible = skis; });
  viewModel.board.visible = board;
  viewModel.sled.visible = sled;
}
for (const b of document.querySelectorAll('#skins button')) {
  b.addEventListener('click', () => chooseSkin(b.dataset.skin));
}
renderSkins();
applySkin();

function startOrResume() {
  state = 'playing';
  ui.overlay.classList.add('hidden');
  ui.hud.classList.add('show');
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    ui.title.innerHTML = 'Paused';
    ui.subtitle.textContent = `${player.points} points, ${Math.floor(-player.z)} m down the mountain. Press R to restart.`;
    ui.go.textContent = 'Press Space or tap to resume';
    ui.keys.hidden = false;
    ui.overlay.classList.remove('hidden');
  } else if (state === 'paused') {
    startOrResume();
  }
}

function restart() {
  newBiomeRun();
  rollTime = 0;
  Object.assign(player, FRESH_PLAYER);
  updateScore(true);
  updateBiome(true);
  layoutSegments();
  updateRollers(0);
  placeRamp();
  placeStones();
  placeCliff();
  spray.life.fill(0);
  spray.pos.fill(-1000);
  applySkin();
  shards.forEach(m => { m.visible = false; });
  startOrResume();
  snapCamera();
}

const airborne = () => player.y > player.ground + 0.001;

function jump() {
  if (state !== 'playing' || airborne()) return;
  player.vy = JUMP_VELOCITY;
  player.rampJump = player.ground > 0; // jumping on the trench ramp is what gets you across
  player.y = player.ground + 0.002;
  emitSpray(player.x, player.z, 0, player.speed, 25);
}

function updatePlayer(dt) {
  const input = (held('ArrowRight', 'KeyD') || touch.right ? 1 : 0) - (held('ArrowLeft', 'KeyA') || touch.left ? 1 : 0);
  const brake = held('ArrowDown') && !airborne();

  player.steer += (input - player.steer) * Math.min(1, dt * 8);
  player.duck += ((held('KeyS') ? 1 : 0) - player.duck) * Math.min(1, dt * 12);

  // The run sets your speed; braking or hitting rocks only slows you for a moment.
  const target = levelKmh(player.points) / 3.6;
  if (brake) player.speed = Math.max(0, player.speed - BRAKE * dt);
  else player.speed = Math.min(target, player.speed + PUSH_ACCEL * dt);

  // Steering turns you, and you keep facing that way until you steer back.
  // Turning is slower in the air and while ducking.
  player.heading += player.steer * TURN_RATE * (airborne() ? 0.6 : 1) * (1 - 0.5 * player.duck) * dt;
  player.heading = THREE.MathUtils.clamp(player.heading, -MAX_HEADING, MAX_HEADING);
  const before = -player.z, beforeX = player.x;
  player.vx = Math.sin(player.heading) * player.speed;
  player.x += player.vx * dt;
  player.z -= Math.cos(player.heading) * player.speed * dt;

  // Off the lip of the ramp: jump on it and you're launched over the trench,
  // otherwise it's just a little kick and you drop in.
  const trench = trenchAt(-player.z);
  if (trench && before <= trench.lip && -player.z > trench.lip
      && Math.abs(player.x - trench.x) < RAMP_W / 2 + 0.3 && player.y < RAMP_H + 2.5) {
    const downhill = Math.max(3, Math.cos(player.heading) * player.speed);
    if (player.rampJump) {
      const flight = (trench.to + RAMP_CLEARANCE - trench.lip) / downhill; // seconds to clear the far side
      const launch = THREE.MathUtils.clamp((GRAVITY * flight * flight / 2 - player.y) / flight, 6, 30);
      player.vy = Math.max(player.vy, launch);
      emitSpray(player.x, player.z, 0, player.speed, 40);
    } else {
      player.vy = Math.max(player.vy, downhill * RAMP_H / RAMP_LEN);
    }
    player.y += 0.002;
  }

  const wasAirborne = airborne() || player.vy > 0;
  player.ground = groundAt(player.x, player.z, player.y);
  if (player.y < player.ground - STEP_UP) {
    // Slammed into the side of a stone, the ramp or the far wall of a trench: bounce back off it.
    player.x = beforeX;
    player.z = -before;
    player.ground = groundAt(player.x, player.z, player.y);
    startCrash(Math.random() < 0.5 ? -1 : 1, null, player.ground < -1 ? stretchAt(before).pit : null);
    return;
  }
  if (wasAirborne || player.y > player.ground) {
    player.vy -= GRAVITY * dt;
    player.y += player.vy * dt;
    if (player.y <= player.ground) {
      player.rampJump = false;
      player.dip = Math.min(0.45, -player.vy * 0.04);
      player.y = player.ground;
      player.vy = 0;
      emitSpray(player.x, player.z, -1, player.speed, 20);
      emitSpray(player.x, player.z, 1, player.speed, 20);
    }
  } else {
    player.y = player.ground; // riding up the ramp
  }
  player.dip = Math.max(0, player.dip - dt * 1.6);

  // Didn't make it across.
  if (player.y < -1.5) {
    startCrash(Math.random() < 0.5 ? -1 : 1, null, stretchAt(-player.z).pit);
    return;
  }

  // Rock walls: touch them and you wipe out.
  if (Math.abs(player.x) > WALL_LIMIT) {
    player.x = Math.sign(player.x) * WALL_LIMIT;
    startCrash(Math.sign(player.x));
    return;
  }

  // The rock wall: through the passage or into the rock. A little give, since the faces are chopped in.
  const cliff = cliffAt(-player.z);
  const face = cliff && cliff.from - PLAYER_RADIUS + 0.3, side = PASSAGE_W / 2 - PLAYER_RADIUS + 0.2;
  if (cliff && -player.z > face && Math.abs(player.x - cliff.x) > side) {
    const scraped = before > face; // already in the passage and caught a side
    if (scraped) player.x = cliff.x + Math.sign(player.x - cliff.x) * side;
    else player.z = -face;
    startCrash(scraped ? Math.sign(player.x - cliff.x) : (Math.random() < 0.5 ? -1 : 1), { kind: 'cliff', x: player.x, z: player.z });
    return;
  }

  // Trees and rocks on the run.
  const hit = hitObstacle();
  if (hit) {
    startCrash(Math.sign(hit.x - player.x) || 1, hit);
    return;
  }

  player.yaw = -player.heading;

  // Spray when carving hard or braking.
  if (!airborne()) {
    const carve = Math.abs(player.steer) * player.speed;
    spray.carry += (carve * 1.6 + (brake ? player.speed * 4 : 0)) * dt;
    const n = Math.floor(spray.carry);
    if (n > 0) {
      spray.carry -= n;
      emitSpray(player.x, player.z, -Math.sign(player.steer || 1), player.speed, n);
    }
  }
}

// ---------------------------------------------------------------------------
// Crashing: the skis shatter and the skier topples into the snow
// ---------------------------------------------------------------------------
const SHARDS_PER_SKI = 6;
const SHARD_LEN = 1.8 / SHARDS_PER_SKI;
const shards = [];
for (let i = 0; i < SHARDS_PER_SKI * 2; i++) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.04, SHARD_LEN * (0.6 + Math.random() * 0.4)),
    i % 4 === 1 ? stripeMat : skiMat
  );
  m.castShadow = true;
  m.visible = false;
  m.userData = { vel: new THREE.Vector3(), spin: new THREE.Vector3() };
  course.add(m);
  shards.push(m);
}

const crash = { t: 0, side: 0, vx: 0, vy: 0, vz: 0, tip: 0, tipVel: 0, spin: 0, landed: false, dist: 0, obstacle: null, pit: null };
const crashLook = new THREE.Vector3();

// side: which way the thing you hit is (+1 = to your right). pit: the trench you fell into.
function startCrash(side, obstacle = null, pit = null) {
  state = 'crashed';
  Object.assign(crash, {
    t: 0, side, landed: false, dist: Math.floor(-player.z), obstacle, pit,
    // Hitting something head-on knocks you back; scraping the wall carries you on; a trench just swallows you.
    vx: pit ? 0 : -side * (obstacle ? 2 : 3), vy: player.vy, vz: pit ? 0 : obstacle ? -1.5 : player.speed * 0.4,
    tip: 0.1, tipVel: 2 + player.speed * 0.05,
    spin: -side * (1.5 + Math.random()),
  });
  player.shake = 0.6;
  crashLook.copy(look);

  // Break each ski into pieces right where it was and fling them away from the rocks.
  skier.skis.forEach(s => { s.visible = false; });
  skier.board.visible = false;
  skier.sled.visible = false;
  const cos = Math.cos(player.yaw), sin = Math.sin(player.yaw);
  shards.forEach((m, i) => {
    const across = (i < SHARDS_PER_SKI ? -1 : 1) * 0.17;
    const along = -0.9 + ((i % SHARDS_PER_SKI) + 0.5) * SHARD_LEN;
    m.position.set(player.x + across * cos + along * sin, player.y + 0.05, player.z - across * sin + along * cos);
    m.rotation.set(0, player.yaw, 0);
    m.userData.vel.set(-side * (2 + Math.random() * 5) + (Math.random() - 0.5) * 3, 3 + Math.random() * 6, -player.speed * (0.2 + Math.random() * 0.4));
    m.userData.spin.set((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20);
    m.visible = true;
  });
  emitSpray(player.x, player.z, -side, player.speed * 0.5, 120);
  if (obstacle?.kind === 'tree') emitSpray(obstacle.x, obstacle.z + 1, 0, 0, 80); // snow shaken off the branches
  if (['snowman', 'fallenSnowman', 'snowHead', 'snowball'].includes(obstacle?.kind)) {
    // Smashed to powder.
    obstacle.mesh.visible = false;
    emitSpray(obstacle.x, obstacle.z + 1.5, -1, 3, 120);
    emitSpray(obstacle.x, obstacle.z + 1.5, 1, 3, 120);
  }

  player.speed = 0;
  ui.speed.textContent = 0;
  ui.toast.classList.remove('show');
}

function updateShards(dt) {
  const friction = Math.exp(-dt * 4);
  for (const m of shards) {
    if (!m.visible) continue;
    const { vel, spin } = m.userData;
    vel.y -= GRAVITY * dt;
    m.position.addScaledVector(vel, dt);
    m.rotation.x += spin.x * dt;
    m.rotation.y += spin.y * dt;
    m.rotation.z += spin.z * dt;
    const floor = groundAt(m.position.x, m.position.z, m.position.y) + 0.03;
    if (m.position.y < floor) {
      m.position.y = floor;
      vel.y = vel.y < -1.5 ? -vel.y * 0.3 : 0;
      vel.x *= friction;
      vel.z *= friction;
      spin.multiplyScalar(friction);
      // Settle flat on the snow.
      const flat = Math.min(1, dt * 8);
      m.rotation.x += (Math.round(m.rotation.x / Math.PI) * Math.PI - m.rotation.x) * flat;
      m.rotation.z += (Math.round(m.rotation.z / Math.PI) * Math.PI - m.rotation.z) * flat;
    }
  }
}

function updateCrash(dt) {
  crash.t += dt;

  // Slide to a stop, away from the rocks.
  const drag = Math.exp(-dt * 1.8);
  crash.vx *= drag;
  crash.vz *= drag;
  player.x = THREE.MathUtils.clamp(player.x + crash.vx * dt, -WALL_LIMIT, WALL_LIMIT);
  player.z -= crash.vz * dt;
  const floor = groundAt(player.x, player.z, player.y);
  if (player.y > floor) {
    crash.vy -= GRAVITY * dt;
    player.y = Math.max(floor, player.y + crash.vy * dt);
  }

  // Topple over like a falling plank, with a little bounce on the snow.
  crash.tipVel += 10 * Math.sin(crash.tip) * dt;
  crash.tip += crash.tipVel * dt;
  if (crash.tip >= Math.PI / 2) {
    crash.tip = Math.PI / 2;
    if (!crash.landed) {
      crash.landed = true;
      player.shake = 0.3;
      emitSpray(player.x, player.z + 1.5, -crash.side, 0, 50);
    }
    crash.tipVel = Math.abs(crash.tipVel) > 1 ? -crash.tipVel * 0.25 : 0;
  }
  crash.spin *= Math.exp(-dt * 2);
  player.yaw += crash.spin * dt;

  const r = skier.root;
  r.position.set(player.x, player.y + Math.sin(crash.tip) * 0.18, player.z);
  r.rotation.set(0, player.yaw, crash.side * crash.tip);
  skier.body.position.y = 0;
  skier.body.scale.y = 1;
  skier.body.rotation.x = 0;

  // The tree you hit shudders.
  if (crash.obstacle?.kind === 'tree') {
    crash.obstacle.mesh.rotation.z = Math.sin(crash.t * 25) * Math.exp(-crash.t * 4) * 0.08;
  }

  updateShards(dt);
  if (state === 'crashed' && crash.t > 1.8) showGameOver();
}

function showGameOver() {
  state = 'over';
  const newBest = player.points > best;
  if (newBest) {
    best = player.points;
    try { localStorage.setItem('powderRun.best', best); } catch {}
  }
  ui.title.innerHTML = 'Wiped <span>out!</span>';
  ui.subtitle.textContent = `${player.points} points · ${crash.dist} m · ` + (player.gems ? `+${player.gems} gem${player.gems > 1 ? 's' : ''} · ` : '')
    + (newBest ? 'New best!' : `Best: ${best} points`);
  ui.go.textContent = 'Press Space or tap to ride again';
  ui.keys.hidden = true;
  ui.overlay.classList.remove('hidden');
}

// ---------------------------------------------------------------------------
// Score: a point every 50 m, and every point makes you faster
// ---------------------------------------------------------------------------
let toastTimer = 0;
function showToast(text) {
  ui.toast.textContent = text;
  ui.toast.classList.remove('show');
  void ui.toast.offsetWidth; // restart the animation
  ui.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => ui.toast.classList.remove('show'), 1800);
}

let currentBiome = biomeAt(0);
function updateBiome(reset = false) {
  const biome = biomeAt(reset ? 0 : -player.z);
  if (biome === currentBiome && !reset) return;
  currentBiome = biome;
  ui.zone.textContent = biome.name;
  if (!reset) showToast(biome.name);
}
updateBiome(true);

function updateScore(reset = false) {
  const points = Math.floor(-player.z / METERS_PER_POINT);
  if (points !== player.points || reset) {
    const before = player.points;
    player.points = points;
    ui.points.textContent = points;
    if (!reset) {
      ui.pointsChip.classList.remove('bump');
      void ui.pointsChip.offsetWidth;
      ui.pointsChip.classList.add('bump');
      if (Math.floor(points / MILESTONE_POINTS) > Math.floor(before / MILESTONE_POINTS)) {
        showToast(`${points} points! ${levelKmh(points)} km/h`);
      }
    }
  }
  // Progress toward the next point.
  const meters = -player.z % METERS_PER_POINT;
  ui.levelBar.style.transform = `scaleX(${meters / METERS_PER_POINT})`;
}

function updateModels(t) {
  const crashed = state === 'crashed' || state === 'over';
  const firstPerson = view === 'first';
  skier.root.visible = !firstPerson || crashed;
  viewModel.root.visible = firstPerson && !crashed;
  if (crashed) return;

  const air = Math.min(1, (player.y - player.ground) / 1.5);
  const bob = state === 'playing' && !airborne() ? Math.sin(t * 11) * 0.012 * Math.min(1, player.speed / 10) : 0;

  // First person: skis tilt onto their edges as you carve.
  const { skis, root } = viewModel;
  skis.rotation.set(CAM_PITCH + air * 0.35, 0, player.steer * 0.25, 'YXZ');
  skis.position.y = -1.45 - air * 0.25 + player.dip * 0.5 + player.duck * DUCK_DROP;
  root.position.y = bob;

  // Third person: lean into turns, tip the skis up in the air, squash on landing.
  const r = skier.root;
  r.position.set(player.x, player.y, player.z);
  r.rotation.set(-air * 0.25, player.yaw, -player.steer * 0.42 * Math.min(1, player.speed / 12));
  const board = skin === 'snowboard';
  skier.body.rotation.set(-player.duck * 0.3, board ? -STANCE : 0, 0); // lean forward into the crouch, side-on on a board
  skier.head.rotation.y = board ? HEAD_TURN : 0;
  skier.body.position.y = bob;
  skier.body.scale.y = 1 - player.dip * 0.5 - player.duck * 0.42;
}

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
const CAM_LOOK_AHEAD = 12;
const CAM_LOOK_DROP = 1.6;
const CAM_PITCH = Math.atan2(CAM_LOOK_DROP, CAM_LOOK_AHEAD);
const eye = new THREE.Vector3();
const look = new THREE.Vector3();
const chase = { heading: 0, y: 3.7 }; // smoothed third-person camera
const lastCamPos = new THREE.Vector3();

function snapCamera() {
  chase.heading = player.heading;
  chase.y = 3.7 + player.y * 0.6;
  updateCamera(0);
  lastCamPos.copy(camera.position);
}

function updateCamera(dt) {
  if (state === 'crashed' || state === 'over') updateCrashCamera(dt);
  else updateRideCamera(dt);

  // Sun and its shadow box follow the skier.
  const p = course.localToWorld(new THREE.Vector3(player.x, 0, player.z - 15));
  sun.target.position.copy(p);
  sun.position.copy(p).add(new THREE.Vector3(-22, 42, -26));

  mountains.position.set(camera.position.x * 0.9, camera.position.y, camera.position.z);
}

function applyShake(dt) {
  if (player.shake <= 0) return;
  const s = player.shake;
  camera.position.x += (Math.random() - 0.5) * s;
  camera.position.y += (Math.random() - 0.5) * s;
  player.shake = Math.max(0, player.shake - dt * 1.8);
}

// Swing out from wherever the camera was to watch the wipeout. Aiming above the
// skier keeps them in the lower part of the screen, below the game-over card.
function updateCrashCamera(dt) {
  const k = 1 - Math.exp(-dt * 2.5);
  const camX = THREE.MathUtils.clamp(player.x - crash.side * 4.5, -HALF_W + 1, HALF_W - 1);
  if (crash.pit?.stones) {
    // Look down into the chasm from the edge of the run.
    course.localToWorld(eye.set(camX, 2.5, player.z + 7));
    course.localToWorld(look.set(player.x, player.y + 2.6, player.z));
  } else if (crash.pit) {
    // Down in the trench with the skier, backed up against the near wall.
    course.localToWorld(eye.set(camX, player.y + 4.5, Math.min(player.z + 6, -crash.pit.from - 0.5)));
    course.localToWorld(look.set(player.x, player.y + 2.6, player.z));
  } else {
    course.localToWorld(eye.set(inPassage(camX, player.z + 6, 0.4), 3.2, player.z + 6));
    course.localToWorld(look.set(player.x, 2.6, player.z));
  }
  camera.position.lerp(eye, k);
  crashLook.lerp(look, Math.min(1, k * 1.6));
  applyShake(dt);
  camera.lookAt(crashLook);
  camera.fov += (60 - camera.fov) * k;
  camera.updateProjectionMatrix();
}

function updateRideCamera(dt) {
  // Chase cam swings round behind you a beat after you turn. Tracked in both
  // views so switching perspective doesn't swoop.
  const k = dt ? 1 - Math.exp(-dt * 4) : 1;
  chase.heading += (player.heading - chase.heading) * k;
  chase.y += (3.7 + player.speed * 0.025 + player.y * 0.6 - chase.y) * k;

  if (view === 'first') {
    const fx = Math.sin(player.heading), fz = -Math.cos(player.heading);
    eye.set(player.x, EYE_HEIGHT - player.duck * DUCK_DROP + player.y - player.dip, player.z);
    look.set(eye.x + fx * CAM_LOOK_AHEAD, eye.y - CAM_LOOK_DROP, eye.z + fz * CAM_LOOK_AHEAD);
  } else {
    const fx = Math.sin(chase.heading), fz = -Math.cos(chase.heading);
    const back = 7.5 + player.speed * 0.06;
    // Keep the camera out of the rock walls when you're facing across the run.
    eye.set(THREE.MathUtils.clamp(player.x - fx * back, -HALF_W + 0.5, HALF_W - 0.5), chase.y, player.z - fz * back);
    eye.x = inPassage(eye.x, eye.z, 0.4); // and out of the rock wall
    if (cliffAt(-eye.z) && -eye.z > cliffAt(-eye.z).from - 0.5) eye.y = Math.min(eye.y, TUNNEL_H - 0.6); // under the roof
    look.set(player.x + fx * 9, 0.9 + player.y * 0.5, player.z + fz * 9);
  }
  course.localToWorld(eye);
  course.localToWorld(look);

  camera.position.copy(eye);
  applyShake(dt);
  camera.lookAt(look);
  camera.rotateZ(-player.steer * (view === 'first' ? 0.1 : 0.03)); // lean into the turn

  const fov = (view === 'first' ? 72 : 62) + Math.min(player.speed, 45) * (view === 'first' ? 0.4 : 0.32);
  if (Math.abs(camera.fov - fov) > 0.01) {
    camera.fov += (fov - camera.fov) * Math.min(1, dt * 3 || 1);
    camera.updateProjectionMatrix();
  }
}

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
updateRollers(0);
placeRamp();
placeStones();
placeCliff();
snapCamera();

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  const t = clock.elapsedTime;

  if (state === 'playing') {
    updateRollers(dt);
    placeRamp();
    placeStones();
    placeCliff();
    updatePlayer(dt);
    recycleSegments(player.z);
    ui.dist.textContent = Math.floor(-player.z);
    updateScore();
    updateBiome();
    ui.speed.textContent = Math.round(player.speed * 3.6);
  }
  if (state === 'crashed' || state === 'over') updateCrash(dt);
  if (state !== 'paused') updateSpray(dt);
  updateGems(t);
  updateDogs(dt);
  updateModels(t);
  updateCamera(dt);
  updateFlakes(state === 'paused' ? 0 : dt, t);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
