<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Powder Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #13243a;
    --panel: rgba(255, 255, 255, 0.72);
    --accent: #ff5a3c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #dfeaf5;
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  canvas { display: block; }

  #hud {
    position: fixed; inset: 16px 16px auto 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    opacity: 0; transition: opacity .4s;
  }
  #hud.show { opacity: 1; }
  .chip {
    background: var(--panel);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 8px 16px;
    box-shadow: 0 4px 18px rgba(20, 40, 70, .12);
  }
  .chip .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
  .chip .value { font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .chip .unit { font-size: 15px; font-weight: 500; opacity: .6; margin-left: 2px; }
  #zone { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-weight: 700; font-size: 15px; padding: 6px 14px; }
  .hud-left { display: flex; gap: 10px; }
  #points-chip { min-width: 92px; }
  #points-chip.bump, #gems-chip.bump { animation: bump .35s ease-out; }
  .gem-icon {
    display: inline-block; width: 14px; height: 18px; margin-right: 6px; vertical-align: 1px;
    background: linear-gradient(135deg, #8ff0ff, #2fb8f0 55%, #1a7fd1);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  @keyframes bump { 40% { transform: scale(1.12); } }
  .level-track { height: 5px; margin-top: 5px; border-radius: 3px; background: rgba(19,36,58,.12); overflow: hidden; }
  #level-bar { height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }

  #toast {
    position: fixed; left: 50%; top: 22%;
    transform: translate(-50%, 0);
    font-size: 40px; font-weight: 700; color: #fff;
    text-shadow: 0 3px 0 var(--accent), 0 6px 24px rgba(19,36,58,.45);
    pointer-events: none; white-space: nowrap; opacity: 0;
  }
  #toast.show { animation: toast 1.8s ease-out forwards; }
  @keyframes toast {
    0% { opacity: 0; transform: translate(-50%, 20px) scale(.8); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
    25% { transform: translate(-50%, 0) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -10px); }
  }

  #overlay {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: linear-gradient(180deg, rgba(223,234,245,.15), rgba(19,36,58,.35));
    transition: opacity .35s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .card {
    text-align: center;
    padding: 28px 32px;
    max-width: min(440px, calc(100vw - 32px));
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(20, 40, 70, .25);
  }
  .card h1 { margin: 0 0 4px; font-size: 48px; line-height: 1; letter-spacing: -.01em; }
  .card h1 span { color: var(--accent); }
  .card p { margin: 8px 0; opacity: .75; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; text-align: left; margin: 18px auto 20px; width: max-content; }
  .keys[hidden] { display: none; }
  kbd {
    font-family: inherit; font-weight: 700; font-size: 13px;
    background: #fff; border-radius: 6px; padding: 2px 7px;
    box-shadow: 0 2px 0 rgba(19,36,58,.25);
  }
  .go {
    display: inline-block; padding: 10px 22px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 18px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .views { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 20px; flex-wrap: wrap; }
  .views-label { font-weight: 700; font-size: 14px; margin-right: 4px; }
  .views button {
    font: inherit; font-weight: 700; font-size: 15px; color: var(--ink);
    background: #fff; border: 2px solid rgba(19,36,58,.15); border-radius: 999px;
    padding: 6px 14px; cursor: pointer;
  }
  .views button.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .views button.locked { opacity: .5; }
  .views .gem-icon { width: 10px; height: 13px; margin: 0 3px 0 2px; }
  .skin-note { font-size: 14px; font-weight: 700; color: var(--accent); margin: -12px 0 14px; opacity: 1 !important; }
  .skin-note:empty { display: none; }
  @media (max-width: 520px) { .card h1 { font-size: 38px; } .chip .value { font-size: 24px; } #zone { display: none; } #toast { font-size: 28px; } }
</style>
</head>
<body>
<div id="hud">
  <div class="hud-left">
    <div class="chip" id="points-chip">
      <div class="label">Points</div><div class="value"><span id="points">0</span></div>
      <div class="level-track"><div id="level-bar"></div></div>
    </div>
    <div class="chip"><div class="label">Distance</div><div class="value"><span id="dist">0</span><span class="unit">m</span></div></div>
    <div class="chip" id="gems-chip"><div class="label">Gems</div><div class="value"><span class="gem-icon"></span><span id="gems">0</span></div></div>
  </div>
  <div class="chip" id="zone">Forest</div>
  <div class="chip"><div class="label">Speed</div><div class="value"><span id="speed">0</span><span class="unit">km/h</span></div></div>
</div>

<div id="toast"></div>

<div id="overlay">
  <div class="card">
    <h1 id="title">Powder <span>Run</span></h1>
    <p id="subtitle">Carve down the mountain. Don't hug the rocks.</p>
    <div class="keys" id="keys">
      <span><kbd>←</kbd> <kbd>→</kbd></span><span>Carve left / right</span>
      <span><kbd>Space</kbd> <kbd>W</kbd></span><span>Jump</span>
      <span><kbd>S</kbd></span><span>Duck</span>
      <span><kbd>↓</kbd></span><span>Brake</span>
      <span><kbd>P</kbd></span><span>Pause</span>
    </div>
    <div class="views" id="views">
      <span class="views-label">View <kbd>V</kbd></span>
      <button data-view="first">First person</button>
      <button data-view="third">Third person</button>
    </div>
    <div class="views" id="skins">
      <span class="views-label">Skins <span class="gem-icon"></span><span id="card-gems">0</span></span>
      <button data-skin="classic">Classic</button>
      <button data-skin="dogSled">Dog Sled</button>
      <button data-skin="snowboard">Snowboard</button>
      <button data-skin="snowmobile">Snowmobile</button>
    </div>
    <p class="skin-note" id="skin-note"></p>
    <div class="go" id="go">Press Space or tap to start</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------------------
// Tuning
// ---------------------------------------------------------------------------
const SLOPE = THREE.MathUtils.degToRad(11); // how steep the mountain is
const HALF_W = 18;           // half width of the groomed run
const WALL_LIMIT = HALF_W - 0.8; // where the skier bounces off the rocks
const SEG_LEN = 50;          // length of one recycled track segment
const NUM_SEGS = 7;
const BANK_WIDTH = 30;       // snow that rises up beyond the run

const METERS_PER_POINT = 50;
const START_KMH = 60;
const KMH_PER_POINT = 1;     // every point makes the run this much faster
const MILESTONE_POINTS = 10; // big pop-up message every this many points
const PUSH_ACCEL = 14;       // how fast you get back up to speed (m/s²)
const BRAKE = 20;
const JUMP_VELOCITY = 10;
const GRAVITY = 24;
const EYE_HEIGHT = 1.65;
const DUCK_DROP = 0.65;
const TURN_RATE = 2.2;       // how fast steering turns you (radians per second)
const MAX_HEADING = Math.PI / 2; // you can turn fully sideways, but never back uphill      // how much lower your eyes are when ducking

// ---------------------------------------------------------------------------
// Renderer / scene
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#dce8f4');
scene.background = makeSkyTexture();
scene.fog = new THREE.Fog(HORIZON, 60, 260);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 1500);

scene.add(new THREE.HemisphereLight('#d6e7ff', '#ffffff', 1.6));
const sun = new THREE.DirectionalLight('#fff3e2', 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 160 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// Everything on the mountain lives in this tilted group. Inside it the run is
// flat: x = sideways, z = downhill (negative), y = up off the snow.
const course = new THREE.Group();
course.rotation.x = -SLOPE;
scene.add(course);
course.updateMatrixWorld();

// ---------------------------------------------------------------------------
// Textures
// ---------------------------------------------------------------------------
function makeSkyTexture() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#5f9fdc');
  grad.addColorStop(0.45, '#a9cbec');
  grad.addColorStop(0.62, '#dce8f4');
  grad.addColorStop(1, '#eef3f8');
  g.fillStyle = grad;
  g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeSnowTexture(corduroy) {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f8fd';
  g.fillRect(0, 0, size, size);
  if (corduroy) {
    // Groomer ridges running downhill.
    for (let x = 0; x < size; x += 8) {
      g.fillStyle = 'rgba(160, 185, 215, 0.22)';
      g.fillRect(x, 0, 3, size);
      g.fillStyle = 'rgba(255, 255, 255, 0.7)';
      g.fillRect(x + 4, 0, 2, size);
    }
  }
  for (let i = 0; i < 2600; i++) {
    const v = Math.random();
    g.fillStyle = v < 0.5 ? 'rgba(170,190,215,0.18)' : 'rgba(255,255,255,0.9)';
    g.fillRect(Math.random() * size, Math.random() * size, 1 + Math.random() * 1.5, 1 + Math.random() * 1.5);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function makeDotTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.8)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function makeBannerTexture(text, aspect) {
  const c = document.createElement('canvas');
  c.height = 128; c.width = Math.round(c.height * aspect);
  const g = c.getContext('2d');
  g.fillStyle = '#ff5a3c';
  g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#ffffff';
  for (let x = 0; x < c.width; x += 64) {
    g.fillRect(x, 0, 32, 12);
    g.fillRect(x + 32, c.height - 12, 32, 12);
  }
  g.font = 'bold 80px Fredoka, system-ui, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(text, c.width / 2, c.height / 2 + 4);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---------------------------------------------------------------------------
// Terrain helpers
// ---------------------------------------------------------------------------
const smoothstep = (a, b, x) => { const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// Height of the snow at sideways offset x and downhill position z.
function snowHeight(x, z) {
  const ax = Math.abs(x);
  if (ax <= HALF_W) return 0;
  const t = smoothstep(HALF_W, HALF_W + 18, ax);
  const lumps = (Math.sin(z * 0.11 + ax * 0.37) + 1.4 * Math.sin(z * 0.053 - ax * 0.21 + (x > 0 ? 2 : 0))) * 0.9;
  return t * 13 + lumps * t;
}

// ---------------------------------------------------------------------------
// Rocks: small libraries of lumpy boulders reused everywhere.
// ---------------------------------------------------------------------------
const ROCK_TONES = ['#6d7079', '#7a7268', '#5d6169', '#847d73', '#666a73'].map(c => new THREE.Color(c));
const BROWN_ROCK_TONES = ['#7a5536', '#6b4a2f', '#86603d', '#5f4129'].map(c => new THREE.Color(c));
const SNOW_CAP = new THREE.Color('#f1f5fb');

// snowLine: how upward-facing a face must be (0..1) before it gets snow on it.
function makeRockGeometry(tones = ROCK_TONES, snowLine = 0.55) {
  let g = new THREE.IcosahedronGeometry(1, 1);
  g.deleteAttribute('normal');
  g.deleteAttribute('uv');
  g = mergeVertices(g);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).multiplyScalar(0.72 + Math.random() * 0.5);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.scale(1 + Math.random() * 0.5, 0.65 + Math.random() * 0.55, 1 + Math.random() * 0.5);
  g.rotateX((Math.random() - 0.5) * 0.5);
  g.rotateZ((Math.random() - 0.5) * 0.5);
  g = g.toNonIndexed();
  g.computeVertexNormals();

  const n = g.attributes.normal;
  const colors = new Float32Array(n.count * 3);
  const base = tones[Math.floor(Math.random() * tones.length)];
  const col = new THREE.Color();
  for (let f = 0; f < n.count; f += 3) {
    const ny = (n.getY(f) + n.getY(f + 1) + n.getY(f + 2)) / 3;
    if (ny > snowLine + Math.random() * 0.15) col.copy(SNOW_CAP);
    else col.copy(base).multiplyScalar(0.82 + Math.random() * 0.32);
    for (let k = 0; k < 3; k++) col.toArray(colors, (f + k) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return g;
}

const pick = list => list[Math.floor(Math.random() * list.length)];
const rockGeos = Array.from({ length: 18 }, () => makeRockGeometry());
const brownRockGeos = Array.from({ length: 10 }, () => makeRockGeometry(BROWN_ROCK_TONES, 0.85));
const rockMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 });
const randomRockGeo = () => pick(rockGeos);
const BROWN_TONES = ['#8f5a31', '#a0683b', '#7d4c2a', '#94603a', '#6f4325'].map(c => new THREE.Color(c)); // Rocks biome and chasm stones

// ---------------------------------------------------------------------------
// Pine trees: stacked green tiers with snow sitting on top of each one.
// ---------------------------------------------------------------------------
const TREE_BRANCH_BOTTOM = 0.9; // lowest branches, before the tree is scaled up
const TREE_GREENS = ['#2e6b3f', '#28603a', '#357244', '#245a35'].map(c => new THREE.Color(c));
const TRUNK_BROWN = new THREE.Color('#5b3d27');

// Give every triangle of a non-indexed geometry one color, chosen from its average height.
function colorFaces(g, colorAt) {
  const p = g.attributes.position;
  const colors = new Float32Array(p.count * 3);
  const col = new THREE.Color();
  for (let f = 0; f < p.count; f += 3) {
    col.copy(colorAt((p.getY(f) + p.getY(f + 1) + p.getY(f + 2)) / 3));
    for (let k = 0; k < 3; k++) col.toArray(colors, (f + k) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  g.deleteAttribute('uv');
  return g;
}

function makeTreeGeometry() {
  const trunk = new THREE.CylinderGeometry(0.16, 0.24, 1.4, 6).toNonIndexed();
  trunk.translate(0, 0.7, 0);
  const parts = [colorFaces(trunk, () => TRUNK_BROWN)];

  const green = pick(TREE_GREENS);
  const tiers = [[1.7, 2.2, TREE_BRANCH_BOTTOM], [1.35, 1.9, 2.1], [0.95, 1.6, 3.2]]; // radius, height, bottom
  for (const [r, h, y0] of tiers) {
    const cone = new THREE.ConeGeometry(r * (0.9 + Math.random() * 0.2), h, 8, 2).toNonIndexed();
    cone.rotateY(Math.random() * Math.PI);
    cone.translate(0, y0 + h / 2, 0);
    parts.push(colorFaces(cone, y => {
      const t = (y - y0) / h;
      // Snow piles on the upper part of each tier and dusts some branch tips.
      if (t > 0.58 + Math.random() * 0.25 || (t < 0.3 && Math.random() < 0.3)) return SNOW_CAP;
      return new THREE.Color().copy(green).multiplyScalar(0.85 + Math.random() * 0.3);
    }));
  }
  return mergeGeometries(parts);
}

const treeGeos = Array.from({ length: 6 }, makeTreeGeometry);
const treeMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 });

// ---------------------------------------------------------------------------
// Snowmen: two lumpy snowballs, coal eyes and buttons, carrot nose, stick arms.
// They face uphill, toward the skier.
// ---------------------------------------------------------------------------
const SNOWBALL_WHITES = ['#f4f7fb', '#e8eef5', '#dde5ee'].map(c => new THREE.Color(c));
const COAL = new THREE.Color('#23262c');
const CARROT = new THREE.Color('#f07c1e');
const STICK = new THREE.Color('#5a3b22');
const SCARF = new THREE.Color('#d8343a');
const RAMP_WOOD = new THREE.Color('#b8743a');
const RAMP_FLAG = new THREE.Color('#ff6a1a');
const SNOWMAN = { bodyY: 0.6, bodyR: 0.75, headR: 0.5 };
SNOWMAN.headY = SNOWMAN.bodyY + (SNOWMAN.bodyR + SNOWMAN.headR) * 0.85;
const SNOWMAN_HEIGHT = SNOWMAN.headY + SNOWMAN.headR; // top of the head, before scaling

// A fallen snowman lies on its side across the run, both balls resting on the snow.
const FALLEN = (() => {
  const { bodyY, bodyR, headR, headY } = SNOWMAN;
  const droop = Math.asin((bodyR - headR) / (headY - bodyY)); // head tips down to the ground
  const lay = Math.cos(droop);
  const bodyX = -bodyY * lay, headX = -headY * lay; // where the balls end up, sideways
  const ends = [bodyX + bodyR, headX - headR];
  return {
    roll: Math.PI / 2 + droop,
    lift: bodyR + bodyY * Math.sin(droop), // raise it so the body sits on the snow
    shift: -(ends[0] + ends[1]) / 2,         // centre the whole length on its spot
    halfLen: (ends[0] - ends[1]) / 2,
    // Body and head are hit separately: the head is low enough to jump.
    balls: [{ x: bodyX, r: bodyR }, { x: headX, r: headR }],
  };
})();

// Flat-colored, non-indexed part ready to merge with the others.
function part(g, colorAt) {
  if (g.index) g = g.toNonIndexed();
  g.deleteAttribute('normal');
  return colorFaces(g, colorAt);
}

function lumpyBall(r) {
  let g = new THREE.IcosahedronGeometry(r, 1);
  g.deleteAttribute('normal');
  g.deleteAttribute('uv');
  g = mergeVertices(g);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const k = 0.9 + Math.random() * 0.18;
    p.setXYZ(i, p.getX(i) * k, p.getY(i) * k, p.getZ(i) * k);
  }
  return part(g, () => pick(SNOWBALL_WHITES));
}

// A thin cylinder from a to b.
function stick(a, b, r, color) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const g = new THREE.CylinderGeometry(r, r * 1.3, dir.length(), 5);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize()));
  g.translate((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2);
  return part(g, () => color);
}

function makeSnowmanGeometry() {
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const { bodyY, bodyR, headR, headY } = SNOWMAN;

  const body = lumpyBall(bodyR);
  body.translate(0, bodyY, 0);
  const head = lumpyBall(headR);
  head.translate(0, headY, 0);
  const parts = [body, head];

  const coal = (x, y, z, r) => {
    const g = part(new THREE.DodecahedronGeometry(r), () => COAL);
    g.translate(x, y, z);
    parts.push(g);
  };
  coal(-0.17, headY + 0.12, headR * 0.88, 0.055);
  coal(0.17, headY + 0.12, headR * 0.88, 0.055);
  for (const y of [bodyY + 0.42, bodyY + 0.12, bodyY - 0.18]) {
    coal(0, y, Math.sqrt(bodyR * bodyR - (y - bodyY) ** 2) * 0.95, 0.07);
  }

  const nose = part(new THREE.ConeGeometry(0.07, 0.4, 6), () => CARROT);
  nose.rotateX(Math.PI / 2);
  nose.translate(0, headY, headR + 0.12);
  parts.push(nose);

  // Arms stick out of the top of the bottom ball.
  const armY = bodyY + bodyR * 0.55;

    course.add(this.group);

    const w = (HALF_W + BANK_WIDTH) * 2;
    const geo = new THREE.PlaneGeometry(w, SEG_LEN, 70, 50);
    geo.rotateX(-Math.PI / 2);
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3), 3));
    this.ground = new THREE.Mesh(geo, bankMat);
    this.ground.receiveShadow = true;
    this.group.add(this.ground);

    const runGeo = new THREE.PlaneGeometry(HALF_W * 2 + 0.6, SEG_LEN, 1, 50);
    runGeo.rotateX(-Math.PI / 2);
    this.run = new THREE.Mesh(runGeo, runMat);
    this.run.position.y = 0.01;
    this.run.receiveShadow = true;
    this.group.add(this.run);

    this.rocks = [];
    for (const layer of ROCK_LAYERS) {
      for (const side of [-1, 1]) {
        for (let i = 0; i < layer.count; i++) {
          const m = new THREE.Mesh(randomRockGeo(), rockMat);
          m.castShadow = layer.shadow;
          m.receiveShadow = true;
          m.userData = { layer, side, i };
          this.group.add(m);
          this.rocks.push(m);
        }
      }
    }

    // Obstacle pools; reset() decides how many are used.
    const maxObstacles = Math.max(...Object.values(BIOMES).map(b => b.obstaclesPerSeg)) + EXTRA_OBSTACLES;
    this.pools = {
      tree: Array.from({ length: maxObstacles }, () => this.addProp(treeGeos[0], treeMat)),
      rock: Array.from({ length: maxObstacles }, () => this.addProp(brownRockGeos[0], rockMat)),
      snowman: Array.from({ length: maxObstacles }, () => this.addProp(snowmanGeos[0], treeMat)),
      fallenSnowman: Array.from({ length: maxObstacles }, () => this.addProp(snowmanGeos[0], treeMat)),
      snowHead: Array.from({ length: maxObstacles }, () => this.addProp(snowHeadGeos[0], treeMat)),
      rockPiece: Array.from({ length: 40 }, () => this.addProp(ledgeGeos[0], rockMat)),
    };
    this.driftPool = Array.from({ length: maxObstacles }, () => this.addProp(driftGeo, treeMat));
    this.baseRockPool = Array.from({ length: maxObstacles * 2 }, () => this.addProp(brownRockGeos[0], rockMat));
    this.bankTrees = Array.from({ length: 2 * Math.max(...Object.values(BIOMES).map(b => b.bankTrees)) },
      () => this.addProp(treeGeos[0], treeMat));
    this.obstacles = [];
    this.gems = [];
  }

  addProp(geo, mat) {
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = true;
    m.receiveShadow = true;
    m.visible = false;
    this.group.add(m);
    return m;
  }

  // Move this segment so its center sits at downhill position z, then rebuild it.
  reset(z) {
    this.z = z;
    this.group.position.z = z;

    const pos = this.ground.geometry.attributes.position;
    const col = this.ground.geometry.attributes.color;
    const c = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const wz = z + pos.getZ(i);
      const cut = pitCut(x, wz);
      pos.setY(i, snowHeight(x, wz) + cut);
      // Shade the banks a touch bluer as they climb so the shape reads, and pits darker.
      const t = smoothstep(HALF_W, HALF_W + 18, Math.abs(x));
      c.setRGB(1 - 0.06 * t, 1 - 0.04 * t, 1);
      if (cut < 0) c.lerp(stretchAt(-wz).pit.color, -cut / TRENCH_DEPTH);
      col.setXYZ(i, c.r, c.g, c.b);
    }
    pos.needsUpdate = true;
    col.needsUpdate = true;
    this.ground.geometry.computeVertexNormals();

    // The groomed run stops at the trench edge (it's tucked away under the trench floor).
    const runPos = this.run.geometry.attributes.position;
    for (let i = 0; i < runPos.count; i++) {
      runPos.setY(i, pitCut(0, z + runPos.getZ(i)) < -0.01 ? -TRENCH_DEPTH - 1 : 0);
    }
    runPos.needsUpdate = true;

    const biome = biomeAt(-(z + SEG_LEN / 2));
    for (const m of this.rocks) {
      const { layer, side, i } = m.userData;
      const r = THREE.MathUtils.lerp(layer.rMin, layer.rMax, Math.random());
      const lz = -SEG_LEN / 2 + (i + Math.random()) * (SEG_LEN / layer.count);
      const x = side * (HALF_W + layer.out + r * 0.8 + Math.random() * 1.2);
      m.geometry = pick(biome.wallGeos);
      m.scale.set(r, r * (0.8 + Math.random() * 0.5), r);
      m.rotation.set(0, Math.random() * Math.PI * 2, 0);
      m.position.set(x, snowHeight(x, z + lz) - r * 0.25, lz);
    }

    this.placeObstacles();
    this.placeBankTrees();
  }

  placeObstacles() {
    const pools = Object.values(this.pools).flat();
    for (const m of [...pools, ...this.baseRockPool, ...this.driftPool]) m.visible = false;
    this.obstacles.length = 0;
    this.gems.length = 0;
    this.baseRocksUsed = 0;
    this.driftsUsed = 0;
    const used = Object.fromEntries(Object.keys(this.pools).map(k => [k, 0]));

    const dist = -(this.z + SEG_LEN / 2); // distance at the top of this segment
    // More obstacles the further down the mountain you get, shared out between the biomes this segment covers.
    const extra = Math.min(EXTRA_OBSTACLES, Math.max(0, dist) / EXTRA_EVERY);
    let count = 0;
    for (let s = stretchAt(dist); s.start < dist + SEG_LEN; s = stretchAt(s.end)) {
      const overlap = Math.min(dist + SEG_LEN, s.end) - Math.max(dist, s.start);
      if (s.biome.obstaclesPerSeg) count += (s.biome.obstaclesPerSeg + extra) * overlap / SEG_LEN;
    }
    count = Math.round(count);
    // Blocked stretches per strip, so there's always a way through.
    const bands = Array.from({ length: Math.ceil(SEG_LEN / BAND) }, () => []);
    const gemSpots = []; // awkward places a gem could go
    for (let tries = 0, placed = 0; placed < count && tries < count * 25; tries++) {
      const lz = (Math.random() - 0.5) * SEG_LEN;
      const x = (Math.random() * 2 - 1) * (HALF_W - 1.2);
      const wz = this.z + lz;
      const biome = biomeAt(-wz);
      if (!biome.obstaclesPerSeg || -wz < START_CLEAR || nearRollerRow(-wz)) continue;
      const kind = pickKind(biome);
      const type = OBSTACLES[kind];
      const pool = type.pool ?? kind;
      const size = type.size();
      const pieces = size.pieces ?? [null];
      if (used[pool] + pieces.length > this.pools[pool].length) continue;
      const radius = type.radius(size);
      const [ex, ez] = type.extent?.(size) ?? [radius, radius];
      if (Math.abs(x) + ex > HALF_W - 0.5) continue;
      if (this.obstacles.some(o => Math.hypot(o.x - x, o.z - wz) < Math.max(OBSTACLE_GAP, o.radius + radius))) continue;

      const span = [x - ex - PLAYER_RADIUS, x + ex + PLAYER_RADIUS];
      const b0 = Math.max(0, Math.floor((lz - ez + SEG_LEN / 2) / BAND));
      const b1 = Math.min(bands.length - 1, Math.floor((lz + ez + SEG_LEN / 2) / BAND));
      let open = true;
      for (let b = b0; b <= b1 && open; b++) open = widestGap([...bands[b], span]) >= MIN_GAP;
      if (!open) continue;
      for (let b = b0; b <= b1; b++) bands[b].push(span);

      placed++;
      if (size.pieces) {
        // A rock formation: each piece is its own rock to stand on or crash into.
        const pieces = size.pieces.map(p => {
          const m = this.pools[pool][used[pool]++];
          m.visible = true;
          const o = { mesh: m, kind, x: x + p.dx, z: wz + p.dz, radius: Math.hypot(p.w, p.d) / 2 };
          this.setupLedge(o, m, lz + p.dz, p);
          this.obstacles.push(o);
          return o;
        });
        // Up on the highest rock, if there are lower ones to climb it from.
        const peak = pieces.reduce((a, b) => (b.top > a.top ? b : a));
        if (pieces.length > 1) gemSpots.push({ x: peak.x, y: peak.top + GEM_LIFT, z: peak.z });
        continue;
      }
      const m = this.pools[pool][used[pool]++];
      m.visible = true;
      const o = { mesh: m, kind, x, z: wz, radius };
      if (kind === 'tree') {
        this.setupTree(o, m, lz, size);
        // Tucked in by the trunk, so you have to duck under the branches for it.
        const a = Math.random() * Math.PI * 2, r = o.trunkRadius + PLAYER_RADIUS + 0.25 + Math.random() * 0.2;
        if (!o.rocky) gemSpots.push({ x: x + Math.cos(a) * r, y: GEM_LIFT, z: wz + Math.sin(a) * r });
      }
      else if (kind === 'rock') this.setupRock(o, m, lz, size);
      else if (kind === 'snowman') this.setupSnowman(o, m, lz, size);
      else if (kind === 'fallenSnowman') this.setupFallenSnowman(o, m, lz, size);
      else this.setupSnowHead(o, m, lz, size);
      this.obstacles.push(o);
    }
    if (gemSpots.length && Math.random() < GEM_CHANCE) this.gems.push({ ...pick(gemSpots), taken: false });
  }

  setupTree(o, m, lz, size) {
    m.geometry = pick(treeGeos);
    m.scale.setScalar(size);
    m.rotation.set(0, Math.random() * Math.PI * 2, 0);
    m.position.set(o.x, 0, lz);

    // Some trees have rocks piled round the trunk, so there's no ducking under them.
    o.rocky = Math.random() < ROCKY_TREE_CHANCE
      && this.baseRocksUsed + ROCKS_PER_ROCKY_TREE <= this.baseRockPool.length;
    if (o.rocky) {
      const turn = Math.random() * Math.PI * 2;
      for (let k = 0; k < ROCKS_PER_ROCKY_TREE; k++) {
        const rock = this.baseRockPool[this.baseRocksUsed++];
        const a = turn + (k / ROCKS_PER_ROCKY_TREE) * Math.PI * 2 + (Math.random() - 0.5) * 0.8;
        const out = o.radius * (0.4 + Math.random() * 0.3);
        const r = (0.32 + Math.random() * 0.15) * size;
        rock.geometry = pick(brownRockGeos);
        rock.scale.set(r, r * 0.75, r);
        rock.rotation.set(0, Math.random() * Math.PI * 2, 0);
        rock.position.set(o.x + Math.cos(a) * out, -r * 0.2, lz + Math.sin(a) * out);
        rock.visible = true;
      }
    }

    // Too tall to jump, but you can duck under the branches, just not through the trunk.
    o.trunkRadius = 0.3 * size;
    o.branchBottom = TREE_BRANCH_BOTTOM * size;
  }

  setupRock(o, m, lz, r) {
    m.geometry = pick(brownRockGeos);
    m.scale.set(r, r * 0.8, r);
    m.rotation.set(0, Math.random() * Math.PI * 2, 0);
    m.position.set(o.x, -r * 0.2, lz);
    o.height = r * 0.95; // low enough to jump over
  }

  setupSnowman(o, m, lz, size) {
    m.geometry = pick(snowmanGeos);
    m.scale.setScalar(size);
    m.rotation.set(0, (Math.random() - 0.5) * 0.8, 0); // roughly facing uphill
    m.position.set(o.x, -0.05, lz);
    o.height = SNOWMAN_HEIGHT * size * 0.92; // only the small ones are low enough to jump
  }

  setupFallenSnowman(o, m, lz, size) {
    m.geometry = pick(snowmanGeos);
    m.scale.setScalar(size);
    const side = Math.random() < 0.5 ? -1 : 1; // which way it toppled
    const yaw = (Math.random() - 0.5) * 0.6;
    m.rotation.set(0, yaw, side * FALLEN.roll); // tipped over, still looking uphill
    const shift = side * FALLEN.shift * size;
    m.position.set(o.x + shift * Math.cos(yaw), FALLEN.lift * size - 0.05, lz - shift * Math.sin(yaw));
    o.balls = FALLEN.balls.map(b => {
      const along = side * (b.x + FALLEN.shift) * size;
      return { x: o.x + along * Math.cos(yaw), z: o.z - along * Math.sin(yaw), radius: b.r * size, height: b.r * 2 * size * 0.92 };
    });
  }

  // Ledges and pillars: an oval rock you can stand on top of.
  // top/halfW/halfD/drift/driftHalfW are what groundAt() and hitObstacle() use.
  setupLedge(o, m, lz, size) {
    m.geometry = pick(ledgeGeos);
    m.scale.set(size.w, size.h, size.d);
    m.rotation.set(0, Math.random() < 0.5 ? 0 : Math.PI, 0);
    m.position.set(o.x, 0, lz);
    Object.assign(o, { top: size.h, halfW: size.w / 2, halfD: size.d / 2, drift: 0, driftHalfW: size.w * 0.18 });
    if (size.drift && this.driftsUsed < this.driftPool.length) {
      // Banked up from a little way into the rock, so it meets the top.
      const d = this.driftPool[this.driftsUsed++];
      d.scale.set(o.driftHalfW * 2, o.top, size.drift + o.halfD * DRIFT_INSET);
      d.position.set(o.x, 0, lz + o.halfD * (1 - DRIFT_INSET));
      d.visible = true;
      o.drift = size.drift;
    }
  }

  setupSnowHead(o, m, lz, size) {
    m.geometry = pick(snowHeadGeos);
    m.scale.setScalar(size);
    m.rotation.set((Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.4);
    m.position.set(o.x, -0.05, lz);
    o.height = (SNOW_HEAD.y + SNOW_HEAD.r) * size * 0.92; // low enough to jump
  }

  // Decorative pines up on the banks behind the rock walls.
  placeBankTrees() {
    const biome = biomeAt(-(this.z + SEG_LEN / 2));
    this.bankTrees.forEach((m, i) => {
      m.visible = i < biome.bankTrees * 2;
      if (!m.visible) return;
      const side = i % 2 ? 1 : -1;
      const x = side * (HALF_W + 8 + Math.random() * 22);
      const lz = (Math.random() - 0.5) * SEG_LEN;
      const cliff = cliffAt(-(this.z + lz));
      if (cliff && Math.abs(x) < CLIFF_OUT + 4) { m.visible = false; return; } // would stick out of the rock wall
      m.geometry = pick(treeGeos);
      m.scale.setScalar(1.8 + Math.random() * 1.2);
      m.rotation.set(0, Math.random() * Math.PI * 2, 0);
      m.position.set(x, snowHeight(x, this.z + lz) - 0.3, lz);
      m.castShadow = false;
    });
  }
}

// Returns the obstacle the skier is touching, if any.
function hitObstacle() {
  const top = player.y + SKIER_HEIGHT - DUCK_SHRINK * player.duck;
  for (const s of segments) {
    for (const o of s.obstacles) {
      if (Math.abs(o.z - player.z) > 4 + (o.halfD ?? 0)) continue;
      const d = Math.hypot(o.x - player.x, o.z - player.z);
      if (o.top) {
        // Rock: fine on top, deadly from the side.
        const ex = (player.x - o.x) / (o.halfW + PLAYER_RADIUS), ez = (player.z - o.z) / (o.halfD + PLAYER_RADIUS);
        if (ex * ex + ez * ez < 1 && player.y < o.top - STEP_UP) return o;
      } else if (o.balls) {
        // Fallen snowman: check the body and the head on their own.
        const ball = o.balls.find(b => player.y < b.height && Math.hypot(b.x - player.x, b.z - player.z) < b.radius + PLAYER_RADIUS);
        if (ball) return o;
      } else if (o.kind === 'tree') {
        if (d < o.trunkRadius + PLAYER_RADIUS) return o;
        if (d < o.radius + PLAYER_RADIUS && (o.rocky || top > o.branchBottom)) return o; // rocks underneath, or didn't duck low enough
      } else if (player.y < o.height && d < o.radius + PLAYER_RADIUS) {
        return o; // didn't jump high enough
      }
    }
  }
  for (const o of rollers) {
    if (player.y < o.height && Math.hypot(o.x - player.x, o.z - player.z) < o.radius + PLAYER_RADIUS) return o;
  }
  return null;
}

const segments = Array.from({ length: NUM_SEGS }, () => new Segment());

// The rolling snowballs: one shared set of meshes, moved to whichever rows are near the player.
const rollerGeos = Array.from({ length: 4 }, () => lumpyBall(ROLLER_RADIUS));
const rollerMeshes = Array.from({ length: 2 * ROLLER_ROWS.length * ROLLERS_PER_ROW }, () => {
  const m = new THREE.Mesh(pick(rollerGeos), treeMat);
  m.castShadow = true;
  m.receiveShadow = true;
  m.visible = false;
  course.add(m);
  return m;
});
const rollers = []; // the ones out on the slope right now, for collisions
let rollTime = 0;

// The trench ramp: a snow kicker with wooden sides and a flag on each corner of the lip.
function makeRampGeometry() {
  const wedge = new THREE.BoxGeometry(RAMP_W, RAMP_H, RAMP_LEN).toNonIndexed();
  wedge.translate(0, RAMP_H / 2, RAMP_LEN / 2); // lip at z = 0, run-in uphill at +z
  const p = wedge.attributes.position;
  for (let i = 0; i < p.count; i++) {
    if (p.getZ(i) > 0 && p.getY(i) > 0) p.setY(i, 0.02); // slope down to the snow at the back
  }
  wedge.deleteAttribute('normal');
  wedge.computeVertexNormals();
  const n = wedge.attributes.normal;
  const parts = [colorFaces(wedge, () => SNOWBALL_WHITES[0])];
  const colors = wedge.attributes.color;
  for (let i = 0; i < n.count; i++) {
    if (n.getY(i) < 0.5) colors.setXYZ(i, ...RAMP_WOOD.toArray()); // the sides
  }
  wedge.deleteAttribute('normal');
  for (const side of [-1, 1]) {
    const x = side * (RAMP_W / 2 + 0.2);
    parts.push(stick(new THREE.Vector3(x, 0, 0), new THREE.Vector3(x, 3, 0), 0.05, STICK));
    const flag = part(new THREE.BoxGeometry(0.7, 0.45, 0.04), () => RAMP_FLAG);
    flag.translate(x - side * 0.4, 2.75, 0);
    parts.push(flag);
  }
  const g = mergeGeometries(parts);
  g.computeVertexNormals();
  return g;
}
const ramp = new THREE.Mesh(makeRampGeometry(), treeMat);
ramp.castShadow = true;
ramp.receiveShadow = true;
course.add(ramp);
// Chasm stones: rough rock pillars standing up out of the drop, flat snow on top at the level of the run.
// Radius 1 (scaled to each stone's size), top at y = 0.
function makeStoneGeometry() {
  const rock = new THREE.CylinderGeometry(1, 1.1, TRENCH_DEPTH + 1, 10, 4).toNonIndexed();
  rock.translate(0, -(TRENCH_DEPTH + 1) / 2 - 0.3, 0);
  const p = rock.attributes.position;
  const kick = Array.from({ length: 64 }, () => 0.82 + Math.random() * 0.16);
  for (let i = 0; i < p.count; i++) {
    const a = Math.round((Math.atan2(p.getZ(i), p.getX(i)) + Math.PI) / (Math.PI * 2) * 10) % 10; // same push for shared corners
    const k = kick[(a + Math.round(-p.getY(i)) * 7) % 64];
    p.setXYZ(i, p.getX(i) * k, p.getY(i), p.getZ(i) * k);
  }
  const tone = pick(BROWN_TONES);
  const sides = colorFaces(rock, () => tone.clone().multiplyScalar(0.7 + Math.random() * 0.45));
  sides.deleteAttribute('normal');

  const cap = new THREE.CylinderGeometry(1, 0.95, 0.4, 12, 1);
  const c = cap.attributes.position;
  // Lumpy edge, the same for every copy of a corner so the snow has no cracks.
  const lump = Array.from({ length: 12 }, () => ({ k: 0.95 + Math.random() * 0.06, drop: Math.random() * 0.15 }));
  for (let i = 0; i < c.count; i++) {
    if (Math.abs(c.getX(i)) + Math.abs(c.getZ(i)) < 1e-6) continue; // centre of the top
    const { k, drop } = lump[Math.round((Math.atan2(c.getZ(i), c.getX(i)) + Math.PI) / (Math.PI * 2) * 12) % 12];
    c.setXYZ(i, c.getX(i) * k, c.getY(i) > 0 ? c.getY(i) : c.getY(i) - drop, c.getZ(i) * k);
  }
  cap.translate(0, -0.2, 0);
  const snow = part(cap, () => pick(SNOWBALL_WHITES));

  const g = mergeGeometries([sides, snow]);
  g.computeVertexNormals();
  return g;
}
const stoneGeos = Array.from({ length: 5 }, makeStoneGeometry);
const stoneMeshes = Array.from({ length: 64 }, () => {
  const m = new THREE.Mesh(pick(stoneGeos), rockMat);
  m.castShadow = true;
  m.receiveShadow = true;
  m.visible = false;
  course.add(m);
  return m;
});
function placeStones() {
  const here = stretchAt(-player.z);
  const stones = here.pit?.stones ?? stretchAt(here.end).pit?.stones ?? [];
  stoneMeshes.forEach((m, i) => {
    const st = stones[i];
    m.visible = !!st;
    if (st) {
      m.scale.set(st.rx, 1, st.rd);
      m.position.set(st.x, 0, -st.d);
    }
  });
}

// The rock wall: two chopped gray blocks either side of the passage, built fresh for each one.
const CLIFF_CHOP = 0.7; // how deep the faces are hacked in (never out into the run)
// y0: the bottom of the block (buried in the snow, or the tunnel ceiling for the roof).
function makeCliffBlock(x0, x1, y0 = -1) {
  const w = x1 - x0, h = CLIFF_H - y0, len = CLIFF_THICK;
  let g = new THREE.BoxGeometry(w, h, len, Math.max(1, Math.ceil(w / 1.6)), 6, Math.ceil(len / 1.6));
  g.deleteAttribute('normal');
  g.deleteAttribute('uv');
  g = mergeVertices(g);
  const p = g.attributes.position;
  const crag = Math.random() * 10;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const onX = Math.abs(Math.abs(x) - w / 2) < 1e-4, onZ = Math.abs(Math.abs(z) - len / 2) < 1e-4;
    x = onX ? x - Math.sign(x) * Math.random() * CLIFF_CHOP : x + (Math.random() - 0.5) * CLIFF_CHOP;
    z = onZ ? z - Math.sign(z) * Math.random() * CLIFF_CHOP : z + (Math.random() - 0.5) * CLIFF_CHOP;
    if (y > h / 2 - 1e-4) y += Math.random() * 1.2 + 0.9 * (Math.sin((x0 + x) * 0.4 + crag) + 1); // jagged crags on top
    else if (y > -h / 2 + 1e-4) y += (Math.random() - 0.5) * CLIFF_CHOP;
    else if (y0 > 0) y += Math.random() * CLIFF_CHOP; // rough tunnel ceiling, never lower than TUNNEL_H
    p.setXYZ(i, x, y, z);
  }
  g = g.toNonIndexed();
  g.translate((x0 + x1) / 2, y0 + h / 2, -len / 2);
  g.computeVertexNormals();
  const n = g.attributes.normal;
  const colors = new Float32Array(n.count * 3);
  const col = new THREE.Color();
  for (let f = 0; f < n.count; f += 3) {
    const ny = (n.getY(f) + n.getY(f + 1) + n.getY(f + 2)) / 3;
    if (ny > 0.35 + Math.random() * 0.2) col.copy(pick(SNOWBALL_WHITES));
    else col.copy(pick(ROCK_TONES)).multiplyScalar(0.8 + Math.random() * 0.35);

  }

}

function placeCliff() {

// Gems: one shared set of spinning crystals, moved to whichever gems are near the player.
const gemGeo = new THREE.OctahedronGeometry(0.32, 0);
gemGeo.scale(1, 1.45, 1);
const gemMat = new THREE.MeshStandardMaterial({
  color: '#38cfff', emissive: '#1577d6', emissiveIntensity: 0.55, flatShading: true, roughness: 0.2, metalness: 0.1,
});
const gemMeshes = Array.from({ length: 32 }, () => {
  const m = new THREE.Mesh(gemGeo, gemMat);
  m.castShadow = true;
  m.visible = false;
  course.add(m);
  return m;
});
function updateGems(t) {
  const here = stretchAt(-player.z);
  const all = [...segments.flatMap(s => s.gems), ...(here.gems ?? []), ...(stretchAt(here.end).gems ?? [])];
  const top = player.y + SKIER_HEIGHT - DUCK_SHRINK * player.duck;
  let used = 0;
  for (const g of all) {
    if (g.taken) continue;
    if (state === 'playing' && Math.hypot(g.x - player.x, g.z - player.z) < GEM_REACH && g.y > player.y - 0.4 && g.y < top + 0.2) {
      g.taken = true;
      collectGem(g);
      continue;
    }
    const m = gemMeshes[used++];
    if (!m) break;
    m.visible = true;
    m.position.set(g.x, g.y + Math.sin(t * 2.5 + g.x) * 0.1, g.z);
    m.rotation.y = t * 2 + g.z;
  }
  for (let i = used; i < gemMeshes.length; i++) gemMeshes[i].visible = false;
}
function collectGem(g) {
  gems++;
  player.gems++;
  try { localStorage.setItem('powderRun.gems', gems); } catch {}
  ui.gems.textContent = gems;
  renderSkins();
  ui.gemsChip.classList.remove('bump');
  void ui.gemsChip.offsetWidth;
  ui.gemsChip.classList.add('bump');
  emitSpray(g.x, g.z, -1, 2, 25);
  emitSpray(g.x, g.z, 1, 2, 25);
}

function placeRamp() {

}
function updateRollers(dt) {
  rollTime += dt;
  rollers.length = 0;
  const here = stretchAt(-player.z);
  const span = ROLLER_REACH * 2;
  let used = 0;
  for (const stretch of [here, stretchAt(here.end)]) {
    for (const row of stretch.rollers ?? []) {
      for (let k = 0; k < ROLLERS_PER_ROW; k++) {
        const along = THREE.MathUtils.euclideanModulo(row.phase + k * span / ROLLERS_PER_ROW + row.dir * row.speed * rollTime, span);
        const x = along - ROLLER_REACH;
        const m = rollerMeshes[used++];
        m.visible = true;
        m.position.set(x, ROLLER_RADIUS * 0.95, -row.dist);
        m.rotation.set(0, 0, -x / ROLLER_RADIUS); // rolling, not sliding
        rollers.push({ mesh: m, kind: 'snowball', x, z: -row.dist, radius: ROLLER_RADIUS, height: ROLLER_RADIUS * 2 * 0.92 });
      }
    }
  }
  for (let i = used; i < rollerMeshes.length; i++) rollerMeshes[i].visible = false;
}
function layoutSegments() {
  segments.forEach((s, i) => s.reset(20 - SEG_LEN / 2 - i * SEG_LEN));
}
layoutSegments();

function recycleSegments(playerZ) {
  for (const s of segments) {
    if (s.z - SEG_LEN / 2 > playerZ + 30) {
      s.reset(s.z - NUM_SEGS * SEG_LEN);
    }
  }
}

function makeMountains() {
  const group = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, fog: false });
  const low = new THREE.Color('#8fa6c2');
  const high = new THREE.Color('#f3f7fc');
  for (let i = 0; i < 16; i++) {
    const h = 90 + Math.random() * 130;
    const r = 70 + Math.random() * 90;
    let g = new THREE.ConeGeometry(r, h, 7 + Math.floor(Math.random() * 4), 4);
    g = g.toNonIndexed();
    const p = g.attributes.position;
    const colors = new Float32Array(p.count * 3);
    const c = new THREE.Color();
    for (let k = 0; k < p.count; k++) {
      // Rough up the silhouette a little.
      const y = p.getY(k);
      if (y < h / 2 - 1) p.setX(k, p.getX(k) * (0.9 + Math.random() * 0.2));
      const t = (y + h / 2) / h;
      c.copy(low).lerp(high, smoothstep(0.35, 0.6, t));
      c.toArray(colors, k * 3);
    }
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat);
    const ang = THREE.MathUtils.lerp(-1.25, 1.25, i / 15) + (Math.random() - 0.5) * 0.15;
    const dist = 520 + Math.random() * 220;
    m.position.set(Math.sin(ang) * dist, h / 2 - 150, -Math.cos(ang) * dist);

  }

}

function limb(a, b, radius, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(radius, Math.max(0.001, len - radius * 2), 4, 10), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  m.castShadow = true;
  return m;
}

function makeSnowmobile() {

function makeSkier() {
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const bootMat = gearMat('#1b1f27');
  const pantsMat = gearMat('#1d3557');
  const jacketMat = gearMat('#16b3a6');
  const skinMat = gearMat('#f1c7a5');
  const helmetMat = gearMat('#ffffff');
  const poleMat = gearMat('#9aa3ad');

  const root = new THREE.Group();
  root.rotation.order = 'YXZ';

  const skis = [], poles = [];
  for (const side of [-1, 1]) {
    const ski = makeSki();
    skis.push(ski);
    ski.position.set(side * 0.17, 0.02, 0);
    const boot = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.32), bootMat);
    boot.position.set(0, 0.11, 0.02);
    boot.castShadow = true;
    ski.add(boot);
    root.add(ski);
  }

  // Everything above the boots squashes a little on landing.
  const body = new THREE.Group();
  root.add(body);
  for (const side of [-1, 1]) {
    const ankle = V(side * 0.17, 0.2, 0.03);
    const knee = V(side * 0.18, 0.56, -0.2);
    const hip = V(side * 0.13, 0.93, 0.08);
    body.add(limb(ankle, knee, 0.08, pantsMat));
    body.add(limb(knee, hip, 0.09, pantsMat));

    const shoulder = V(side * 0.22, 1.38, -0.1);
    const elbow = V(side * 0.31, 1.13, -0.26);
    const hand = V(side * 0.31, 1.0, -0.48);
    body.add(limb(shoulder, elbow, 0.07, jacketMat));
    body.add(limb(elbow, hand, 0.065, jacketMat));
    const glove = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), bootMat);
    glove.position.copy(hand);
    body.add(glove);

    const poleTip = V(side * 0.42, 0.06, 0.55);
    const pole = limb(hand, poleTip, 0.016, poleMat);
    poles.push(pole);
    body.add(pole);
  }
  body.add(limb(V(0, 0.92, 0.08), V(0, 1.42, -0.12), 0.2, jacketMat));

  const head = new THREE.Group();
  head.position.set(0, 1.62, -0.2);
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), skinMat);
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.55), helmetMat);
  helmet.position.y = 0.02;
  const goggles = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.08, 0.08), goggleMat);
  goggles.position.set(0, 0.02, -0.11);
  for (const m of [face, helmet, goggles]) { m.castShadow = true; head.add(m); }
  body.add(head);

  const board = makeBoard(bootMat);
  const sled = makeSnowmobile();
  root.add(board, sled);

  course.add(root);
  return { root, body, head, skis, poles, board, sled };
}
